pluginGroup = com.bidaide
# Major.minor are set here; on CI the patch number is the run number of the release workflow.
pluginVersion = 0.1.0

# Local Android Studio used to compile against and to run the sandbox IDE. Where this folder does not exist
# (CI, other machines) androidStudioVersion is downloaded instead.
androidStudioPath = /Users/david/Applications/Android Studio.app
androidStudioVersion = 2026.1.2.10

# IntelliJ IDEA that verifyPlugin also checks against (only the GitHub part loads there); same fallback as above.
intellijIdeaPath = /Users/david/Applications/IntelliJ IDEA.app
intellijIdeaVersion = 2026.1.3

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = false
# Machine-specific: the JBR 21 of the local Android Studio. CI overrides it with -Dorg.gradle.java.home.
org.gradle.java.home = /Users/david/Applications/Android Studio.app/Contents/jbr/Contents/Home

# Compiling against the full Android Studio classpath needs more heap than the defaults.
org.gradle.jvmargs = -Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs = -Xmx3g
