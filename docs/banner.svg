  <!-- Title -->
  <text x="384" y="176" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1">Bidaide Notificator</text>
