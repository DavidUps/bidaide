name: Test and release

# Pull requests: tests and build only.
# Push to main: tests -> next version -> build -> JetBrains Marketplace -> GitHub Release.
on:
  push:
    branches: [main]
    # Documentation alone does not make a new version of the plugin.
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']
  pull_request:
  workflow_dispatch:

# Releases of the same branch run one after another, so two pushes never compute the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  # gradle.properties points org.gradle.java.home at a developer machine; on CI it is the JDK set up below.
  GRADLE_ARGS: --no-configuration-cache --console=plain

jobs:
  pipeline:
    name: Test, version, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # Marketplace publishing is skipped until PUBLISH_TOKEN exists; signing until the three signing secrets exist.
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version is derived from the existing tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # --- 1. Validate ---
      - name: Run tests
        run: ./gradlew test -Dorg.gradle.java.home="$JAVA_HOME" $GRADLE_ARGS

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          if-no-files-found: ignore

      # --- 2. Version ---
      # major.minor come from pluginVersion in gradle.properties; the patch number is one more than the highest
      # existing tag of that major.minor (0 when there is none). Raising major.minor starts again at .0.
      - name: Compute next version
        id: version
        run: |
          base=$(grep -E '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ' | cut -d. -f1,2)
          last=$(git tag -l "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ "$IS_RELEASE" = "true" ]; then version="${base}.$(( ${last:--1} + 1 ))"; else version="${base}.0-pr${{ github.event.number || github.run_number }}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Versión: $version" >> "$GITHUB_STEP_SUMMARY"

      # --- 3. Build ---
      - name: Build plugin
        id: build
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.version.outputs.version }} -Dorg.gradle.java.home="$JAVA_HOME" $GRADLE_ARGS

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: bidaide-${{ steps.version.outputs.version }}
          path: build/distributions/*.zip

      # --- 4. Publish: JetBrains Marketplace first, then GitHub Releases ---
      - name: Publish to JetBrains Marketplace
        if: env.IS_RELEASE == 'true' && env.PUBLISH_TOKEN != ''
        run: ./gradlew publishPlugin -PpluginVersion=${{ steps.version.outputs.version }} -Dorg.gradle.java.home="$JAVA_HOME" $GRADLE_ARGS

      - name: Note that Marketplace publishing is not configured
        if: env.IS_RELEASE == 'true' && env.PUBLISH_TOKEN == ''
        run: |
          echo "JetBrains Marketplace omitido: falta el secret PUBLISH_TOKEN." >> "$GITHUB_STEP_SUMMARY"

      # Still runs when the Marketplace step fails (a first upload awaiting approval, say): the tag and the zip
      # are created anyway and the run stays red so the failure is seen.
      - name: Create GitHub release
        if: ${{ !cancelled() && env.IS_RELEASE == 'true' && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          build/distributions/bidaide-${{ steps.version.outputs.version }}.zip
          --title "Bidaide ${{ steps.version.outputs.version }}"
          --generate-notes
          --target "$GITHUB_SHA"
