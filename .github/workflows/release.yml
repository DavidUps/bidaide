name: Build and release

# Every push to main builds the plugin and publishes it as a GitHub Release.
# Pull requests are built and tested, without releasing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional. When set, pushes to main are also published to the JetBrains Marketplace.
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # major.minor come from gradle.properties, the patch number is the run number: 0.1.0 -> 0.1.<run>.
      - name: Compute version
        id: version
        run: |
          base=$(grep -E '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ' | cut -d. -f1,2)
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # gradle.properties points org.gradle.java.home at a developer machine; here it is the JDK set up above.
      - name: Test and build
        run: >
          ./gradlew test buildPlugin
          -PpluginVersion=${{ steps.version.outputs.version }}
          -Dorg.gradle.java.home="$JAVA_HOME"
          --no-configuration-cache --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bidaide-${{ steps.version.outputs.version }}
          path: |
            build/distributions/*.zip
            build/reports/tests/
          if-no-files-found: ignore

      - name: Create GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          build/distributions/*.zip
          --title "Bidaide ${{ steps.version.outputs.version }}"
          --generate-notes
          --target "$GITHUB_SHA"

      - name: Publish to JetBrains Marketplace
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PUBLISH_TOKEN != ''
        run: >
          ./gradlew publishPlugin
          -PpluginVersion=${{ steps.version.outputs.version }}
          -Dorg.gradle.java.home="$JAVA_HOME"
          --no-configuration-cache --console=plain
