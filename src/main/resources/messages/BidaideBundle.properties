settings.adb.customCommands=Custom commands:
settings.adb.customCommands.comment=One per line: <code>Name = shell command</code>. <code>{package}</code> is the app id. They appear in the ADB popup.
settings.adb.profiles=Device profiles:
settings.adb.profiles.comment=One per line: <code>Name = key=value, key=value</code>. Keys: dark, animations, touches, dontkeep, wifi, data (on/off), font (e.g. 1.3), rotation (portrait/landscape/auto), locale (e.g. ar, or system). Example: <code>Accessibility = dark=on, font=1.3, animations=off</code>
